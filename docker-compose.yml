# =============================================================================
# EOA Global (Emergency Orchestrator Agent) - Sovereign Production Orchestration
# Air-Gap Ready | Pinned Manifest Digests | Host Ports Strictly Sealed
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostGIS Geospatial Database Engine (SRID 4326, GiST Indexes, RLS)
  # Internal network only; NO host-published ports (prevents WAN/LAN intrusion)
  # ---------------------------------------------------------------------------
  postgis:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    container_name: eoa-postgis-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: eoa_global_db
    # Port Obfuscation: Non-standard high-range port 15432 for PostGIS
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - eoa_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eoa_global_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eoa_network

  # ---------------------------------------------------------------------------
  # 2. Redis Message Broker & Real-Time Event Bus (Password Protected)
  # Internal network only; NO host-published ports
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2.4-alpine@sha256:c8bb255c3559b3e458766db810aa7b3c7af1235b204cfdb304e79ff388fe1a5a
    container_name: eoa-redis-broker
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-eoa_redis_secure_pass_2026}" --appendonly yes
    # PORTS OMITTED DELIBERATELY - Accessible strictly via eoa_network
    volumes:
      - eoa_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-eoa_redis_secure_pass_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eoa_network

  # ---------------------------------------------------------------------------
  # 3. Valhalla Sovereign Routing Engine (Dynamic Polygon Avoidance, Tiling)
  # Internal network only; NO host-published ports
  # ---------------------------------------------------------------------------
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:3.4.0@sha256:e51408745e49ea888ce4a9ab7408636a238d8ae2d463a9ee29ac7351d06f4132
    container_name: eoa-valhalla-router
    restart: always
    environment:
      - build_elevation=False
      - use_tiles_ignore_pbf=True
    # PORTS OMITTED DELIBERATELY - Port 8002 accessed internally by backend
    volumes:
      - ./data/valhalla:/custom_files
    networks:
      - eoa_network

  # ---------------------------------------------------------------------------
  # 4. EOA Global FastAPI Backend (Multi-Tenancy, PostGIS GiST, Valhalla Client)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./eoa_global_backend
      dockerfile: Dockerfile
    container_name: eoa-backend-api
    restart: always
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      valhalla:
        condition: service_started
    environment:
      POSTGRES_SERVER: postgis
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: eoa_global_db
      BROKER_TYPE: redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-eoa_redis_secure_pass_2026}@redis:6379/0
      VALHALLA_HOST: valhalla
      SECRET_KEY: eoa-enterprise-super-secret-key-change-in-production-2026-global
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ""
      LOCAL_LLM_BASE_URL: "http://ollama:11434/v1"
      LOCAL_LLM_MODEL_NAME: "llama3.2"
      PYTHONUNBUFFERED: "1"
    ports:
      # Expose host port 9443 mapped to internal backend port 8000 (also support 8000)
      - "9443:8000"
      - "8000:8000"
    networks:
      - eoa_network

  # ---------------------------------------------------------------------------
  # 5. EOA Global React 18 + Vite Frontend Dashboard (Nginx Production Reverse Proxy)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./eoa_global_frontend
      dockerfile: Dockerfile
    container_name: eoa-frontend-dashboard
    restart: always
    depends_on:
      - backend
    ports:
      # Port Obfuscation: Non-standard high-range port 49152 for C4ISR Frontend Terminal
      - "49152:80"
    networks:
      - eoa_network

  # ---------------------------------------------------------------------------
  # 6. EOA Tactical Edge Mobile Terminal (Field Operative GPS SOS PWA)
  # ---------------------------------------------------------------------------
  edge-app:
    build:
      context: ./eoa_edge_app
      dockerfile: Dockerfile
    container_name: eoa-edge-app
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - eoa_network

# -----------------------------------------------------------------------------
# Persistent Volumes & Network Definitions
# -----------------------------------------------------------------------------
volumes:
  eoa_postgis_data:
    name: eoa_postgis_data
  eoa_redis_data:
    name: eoa_redis_data

networks:
  eoa_network:
    name: eoa_network
    driver: bridge
