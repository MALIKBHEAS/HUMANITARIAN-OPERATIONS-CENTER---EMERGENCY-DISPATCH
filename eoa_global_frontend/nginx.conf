server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Global ETag configuration
    etag on;

    # Gzip compression for static text/js/css (strictly disabled for PMTiles)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker internal DNS resolver (enables dynamic runtime resolution without crashing on startup)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Vector & Raster PMTiles Byte-Range Serving
    location /tiles/ {
        # Strict Range & ETag revalidation without immutable
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept";
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag";
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        
        # Crucial: Disable gzip compression on PMTiles to preserve HTTP 206 Partial Content byte ranges
        gzip off;
        try_files $uri =404;
    }

    # Map Styles (Revalidation on every request)
    location /styles/ {
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Content-Hashed Production Assets (Vite Dist) - Immutable Allowed
    location /assets/ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Font Glyphs and WOFF2 Typography (Air-Gapped Revalidation)
    location /fonts/ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    # Local Vendor Bundles (e.g. mapbox-gl-rtl-text)
    location /vendor/ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    # Service Worker (no-store so updates are fetched immediately)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA Routing: Any unknown path falls back to index.html
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy for REST API
    location /api/ {
        set $backend_upstream "http://backend:8000";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy for Real-Time WebSockets
    location /ws/ {
        set $backend_upstream "http://backend:8000";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
