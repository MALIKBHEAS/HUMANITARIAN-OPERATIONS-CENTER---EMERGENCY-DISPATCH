version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: eoa-postgis-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: emergency_gis
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emergency_gis"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eoa-fastapi-backend
    restart: always
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgrespassword@postgis:5432/emergency_gis
      PYTHONUNBUFFERED: "1"
    ports:
      - "9443:9443"

volumes:
  postgis_data:
